    <text x="24" y="143" fill="#A1A1A6" font-size="12.5" font-weight="400">interfaces backed by resilient,</text>
    <text x="24" y="162" fill="#A1A1A6" font-size="12.5" font-weight="400">type-safe distributed data layers.</text>
  </g>
