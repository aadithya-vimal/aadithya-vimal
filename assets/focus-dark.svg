    </g>
    <text x="24" y="92" fill="#F5F5F7" font-size="16" font-weight="600" letter-spacing="-0.2">Security Architecture</text>
    <text x="24" y="124" fill="#A1A1A6" font-size="12.5" font-weight="400">Threat-aware design from day one.</text>
    <text x="24" y="143" fill="#A1A1A6" font-size="12.5" font-weight="400">Adversarial surface analysis, protocol</text>
    <text x="24" y="162" fill="#A1A1A6" font-size="12.5" font-weight="400">triage, and static validation.</text>
  </g>
  <g transform="translate(291, 0)">
