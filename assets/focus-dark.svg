<svg width="860" height="186" viewBox="0 0 860 186" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Engineering Focus</title>
  <desc id="desc">Three core engineering disciplines: Security Architecture, Full-Stack Systems, and Applied Intelligence.</desc>
